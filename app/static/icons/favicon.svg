<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="decks">
  <!-- Same mark as icon.svg, at half scale. Two deliberate deviations, both for 16 px:
       the outline is thickened (0.85 would be sub-pixel) and the bevel is dropped (a 1.3 line
       inside an 8 px card is noise, not detail). Follows the system theme: the light branch is
       also what the .ico is rasterized from. -->
  <style>
    .tile{fill:#e6e6e0} .card{fill:#f4f4f0;stroke:#111;stroke-width:1.9}
    @media (prefers-color-scheme:dark){
      .tile{fill:#0b0b0a} .card{fill:#111;stroke:#f4f4f0}
    }
  </style>
  <rect width="32" height="32" class="tile"/>
  <g class="card">
    <rect x="11" y="11" width="16" height="16"/>
    <rect x="8" y="8" width="16" height="16"/>
    <rect x="5" y="5" width="16" height="16"/>
  </g>
</svg>
