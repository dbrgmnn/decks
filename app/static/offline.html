<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decks — offline</title>
<script>try{document.documentElement.dataset.theme=localStorage.theme||"light"}catch{document.documentElement.dataset.theme="light"}</script>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/offline.css">
</head>
<body>
<main class="offline">
  <h1>Decks</h1>
  <p data-i18n="title">You’re offline.</p>
  <p class="muted" data-i18n="hint">Your decks live on the server, so reconnect to keep studying.</p>
  <button class="retry" type="button" data-i18n="retry">Try again</button>
  <small class="offline-status" role="status"></small>
</main>
<script>
(function () {
  var text = {
    en: {
      title: 'You’re offline.',
      hint: 'Your decks live on the server, so reconnect to keep studying.',
      retry: 'Try again',
      checking: 'Checking…',
      still: 'Still offline. Check your connection.'
    },
    de: {
      title: 'Du bist offline.',
      hint: 'Deine Decks liegen auf dem Server. Stelle die Verbindung wieder her, um weiterzulernen.',
      retry: 'Erneut versuchen',
      checking: 'Wird geprüft…',
      still: 'Immer noch offline. Prüfe deine Verbindung.'
    }
  };
  var match = document.cookie.match(/(?:^|;\s*)decks_lang=(en|de)/);
  var lang = match ? match[1] : ((navigator.language || 'en').toLowerCase().indexOf('de') === 0 ? 'de' : 'en');
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function (node) {
    node.textContent = text[lang][node.dataset.i18n];
  });

  var button = document.querySelector('.retry');
  var status = document.querySelector('.offline-status');
  var checking = false;

  var check = function () {
    if (checking) return;
    checking = true;
    button.disabled = true;
    status.textContent = text[lang].checking;
    fetch('/healthz', {cache: 'no-store'}).then(function (response) {
      if (response.ok) {
        location.reload();
        return;
      }
      status.textContent = text[lang].still;
    }).catch(function () {
      status.textContent = text[lang].still;
    }).finally(function () {
      checking = false;
      button.disabled = false;
    });
  };

  button.addEventListener('click', check);
  addEventListener('online', check);
  setInterval(check, 10000);
})();
</script>
</body>
</html>
