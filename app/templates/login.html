<!doctype html>
<html lang="{{ lang }}">
<head>
{% include "_head.html" %}
</head>
<body>
<main class="auth">
  <form id="auth-form" class="auth-card">
    <h1>Decks</h1>
    <input name="email" type="email" placeholder="{{ t('login.email') }}" maxlength="254" autocomplete="email" required>
    <div class="password-field">
      <input name="password" type="password" placeholder="{{ t('login.password') }}" maxlength="128" autocomplete="current-password" required>
      <button type="button" class="password-toggle" aria-label="{{ t('password.show') }}" aria-pressed="false">
        <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
        <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3 3 18 18M10.6 6.2A10.9 10.9 0 0 1 12 6c6.5 0 10 6 10 6a18.4 18.4 0 0 1-3.1 3.6M6.3 6.4C3.5 8.1 2 12 2 12s3.5 6 10 6a10.8 10.8 0 0 0 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
    </div>
    <div class="password-field" hidden>
      <input name="password2" type="password" placeholder="{{ t('login.repeat_password') }}" maxlength="128" autocomplete="new-password" required>
      <button type="button" class="password-toggle" aria-label="{{ t('password.show') }}" aria-pressed="false">
        <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
        <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3 3 18 18M10.6 6.2A10.9 10.9 0 0 1 12 6c6.5 0 10 6 10 6a18.4 18.4 0 0 1-3.1 3.6M6.3 6.4C3.5 8.1 2 12 2 12s3.5 6 10 6a10.8 10.8 0 0 0 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
    </div>
    <button type="submit" id="submit" class="primary">{{ t('login.sign_in') }}</button>
    <button type="button" id="switch" class="link">{{ t('login.create_account') }}</button>
    <small id="msg"></small>
  </form>
</main>
<script type="module" src="{{ asset('login.js') }}"></script>
</body>
</html>
